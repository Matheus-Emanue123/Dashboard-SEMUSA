version: 2
updates:
  # Monitoramento de dependências do Frontend (Node / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "frontend"

  # Monitoramento de dependências do Backend (Node / npm)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "backend"
    ignore:
      # o Nest 12 é ESM puro e o backend é CommonJS: fica no Nest 11 até migrar o backend para ESM
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # o ts-jest ainda não suporta o TypeScript 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # os tipos precisam acompanhar a versão do Node usada em produção
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Monitoramento de dependências do Backend (Python / pip) caso seja adotado
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "backend"

  # Monitoramento de segurança dos próprios Workflows do GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "security"
